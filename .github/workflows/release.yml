name: Build and Release Windows Application

on:
  push:
    tags:
      - 'v*'  # 仅当推送的标签以 "v" 开头时触发（例如 v1.0.0）

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整的 Git 历史记录，以便正确提取标签

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # 使用你项目所需的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Get version from tag
      id: get_version
      run: |
        # 从 github.ref 中提取标签名称（例如 refs/tags/v1.0.0）
        TAG_NAME=${GITHUB_REF#refs/tags/}
        # 去掉标签名称中的 "v" 前缀（例如 v1.0.0 -> 1.0.0）
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Package application
      run: |
        # 使用 PyInstaller 打包 Python 程序，并将版本号嵌入文件名
        pyinstaller -F --noconsole --name main_${{ steps.get_version.outputs.version }} main.py

    - name: List dist directory
      run: |
        # 列出 dist 目录内容，确保文件已生成
        dir dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4  # 使用最新版本 v4
      with:
        name: windows-application
        path: dist/  # PyInstaller 输出的目录

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        tag_name: ${{ github.ref }}  # 使用当前标签名称
        release_name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/main_${{ steps.get_version.outputs.version }}.exe  # 打包后的可执行文件路径
        asset_name: main_${{ steps.get_version.outputs.version }}.exe
        asset_content_type: application/octet-stream