name: Build and Release Windows Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # 使用你项目所需的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Package application
      run: |
        # 使用 PyInstaller 打包 Python 程序
        pyinstaller -F --noconsole main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4  # 使用最新版本 v4
      with:
        name: windows-application
        path: dist/  # PyInstaller 输出的目录

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        tag_name: v1.0.0  # 你可以动态生成版本号
        release_name: Release v1.0.0
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/main.exe  # 打包后的可执行文件路径
        asset_name: main.exe
        asset_content_type: application/octet-stream