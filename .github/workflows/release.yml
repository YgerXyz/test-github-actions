name: Build and Release Windows Application

on:
  push:
    tags:
      - 'v*'  # 仅当推送的标签以 "v" 开头时触发（例如 v1.0.0）

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整的 Git 历史记录，以便正确提取标签

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # 使用你项目所需的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Extract tag name
      id: extract_tag
      shell: pwsh  # 使用 PowerShell 作为脚本解释器
      run: |
        # 从 github.ref 中提取标签名称（例如 refs/tags/v1.0.14 -> v1.0.14）
        $TAG_NAME = $env:GITHUB_REF -replace 'refs/tags/', ''
        echo "tag_name=$TAG_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "Extracted tag name: $TAG_NAME"

    - name: Package application
      run: |
        # 使用 PyInstaller 打包 Python 程序，并将标签名称嵌入文件名
        pyinstaller -F --noconsole --name main_${{ steps.extract_tag.outputs.tag_name }} main.py

    - name: List dist directory
      run: |
        # 列出 dist 目录内容，确保文件已生成
        dir dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4  # 使用最新版本 v4
      with:
        name: windows-application
        path: dist/  # PyInstaller 输出的目录

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        tag_name: ${{ steps.extract_tag.outputs.tag_name }}  # 使用提取的标签名称
        release_name: Release ${{ steps.extract_tag.outputs.tag_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/main_${{ steps.extract_tag.outputs.tag_name }}.exe  # 打包后的可执行文件路径
        asset_name: main_${{ steps.extract_tag.outputs.tag_name }}.exe
        asset_content_type: application/octet-stream