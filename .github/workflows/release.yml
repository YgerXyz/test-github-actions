name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 仅当推送的标签以 "v" 开头时触发（例如 v1.0.0）

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # 使用你项目所需的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Extract tag name
      id: extract_tag
      shell: pwsh  # 使用 PowerShell 作为脚本解释器
      run: |
        # 从 github.ref 中提取标签名称（例如 refs/tags/v1.0.0 -> v1.0.0）
        $TAG_NAME = $env:GITHUB_REF -replace 'refs/tags/', ''
        # 使用环境文件设置输出变量
        echo "tag_name=$TAG_NAME" >> $env:GITHUB_OUTPUT
        echo "Extracted tag name: $TAG_NAME"

    - name: Build application
      run: |
        # 使用 PyInstaller 打包 Python 程序
        pyinstaller -F --noconsole main.py

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        tag_name: ${{ steps.extract_tag.outputs.tag_name }}  # 使用提取的标签名称
        release_name: Release ${{ steps.extract_tag.outputs.tag_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN 作为 GitHub Token
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/main.exe  # 打包后的可执行文件路径
        asset_name: document-info-tools_${{ steps.extract_tag.outputs.tag_name }}.exe  # 上传后的文件名
        asset_content_type: application/octet-stream