name: Release and Package

on:
  push:
    branches:
      - main  # 推送到 main 分支时触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 使用 pyinstaller 打包 main.py
      - name: Package with PyInstaller
        run: |
          python -m PyInstaller -F --windowed main.py

      # 创建 Release 并上传打包文件
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN
        with:
          tag_name: release-${{ github.run_id }}  # 使用唯一的 tag 名称
          release_name: Release ${{ github.run_id }}
          draft: false
          prerelease: false

      # 上传打包文件到 Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 使用 MY_TOKEN
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/main.exe  # PyInstaller 生成的 .exe 文件路径
          asset_name: main.exe
          asset_content_type: application/octet-stream