name: Release and Package

on:
  push:
    branches:
      - 'main'  # 仅当推送到 main 分支时触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 使用 pyinstaller 打包 main.py
      - name: Package with PyInstaller
        run: |
          # 获取仓库名称（repo name）并直接设置文件名
          $repoName = $env:GITHUB_REPOSITORY.Split('/')[1]  # 获取仓库名称
          # 使用 PyInstaller 打包，直接指定输出文件名
          python -m PyInstaller -F --windowed --name $repoName main.py

      # 获取推送的标签名称，去掉 "refs/tags/" 前缀
      - name: Set release tag name
        run: |
          # 处理 tag 名称，去掉 refs/tags/ 前缀
          $tagName = $env:GITHUB_REF -replace '^refs/tags/', ''
          echo "RELEASE_TAG_NAME=$tagName" >> $GITHUB_ENV

      # 创建 Release 并上传打包文件
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}  # 使用处理后的标签名
          release_name: Release ${{ env.RELEASE_TAG_NAME }}
          draft: false
          prerelease: false

      # 上传打包文件到 Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/$repoName.exe  # 生成的打包文件路径
          asset_name: $repoName.exe  # 固定的文件名
          asset_content_type: application/octet-stream
