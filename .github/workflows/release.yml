name: Release and Package

on:
  push:
    branches:
      - main  # 推送到 main 分支时触发
    tags:
      - "v*"  # 推送以 "v" 开头的标签时触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 提取仓库名称
      - name: Extract repository name
        id: extract_repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          echo "Repository name: $REPO_NAME"
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      # 使用 pyinstaller 打包 main.py
      - name: Package with PyInstaller
        run: |
          python -m PyInstaller -F --windowed --name ${{ steps.extract_repo_name.outputs.repo_name }} main.py

      # 创建 Release 并上传打包文件
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      # 上传打包文件到 Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/${{ steps.extract_repo_name.outputs.repo_name }}.exe  # 使用仓库名称
          asset_name: ${{ steps.extract_repo_name.outputs.repo_name }}.exe  # 使用仓库名称
          asset_content_type: application/octet-stream