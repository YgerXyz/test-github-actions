name: Release and Package

on:
  push:
    tags:
      - "v*"  # 仅推送以 "v" 开头的标签时触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 使用 pyinstaller 打包 main.py
      - name: Package with PyInstaller
        run: |
          # 获取标签名称，去掉 "v" 前缀
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # 使用 PyInstaller 打包，生成项目名称-tag.exe 格式的文件
          python -m PyInstaller -F --windowed main.py
          # 重命名生成的文件
          mv ./dist/main.exe ./dist/${{ github.repository }}-${TAG_NAME}.exe

      # 创建 Release 并上传打包文件
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      # 上传打包文件到 Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/${{ github.repository }}-${GITHUB_REF#refs/tags/}.exe  # 生成的打包文件路径
          asset_name: ${{ github.repository }}-${GITHUB_REF#refs/tags/}.exe
          asset_content_type: application/octet-stream
